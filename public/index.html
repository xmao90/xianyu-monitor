<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闲鱼上新监控</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #ff6b35;
      --primary-dark: #e55a2b;
      --bg: #0f0f13;
      --bg2: #1a1a22;
      --bg3: #24242e;
      --text: #e8e8ec;
      --text2: #8888a0;
      --border: #2a2a38;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
      --blue: #60a5fa;
    }
    body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* 登录页 */
    #login-page {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
      background: radial-gradient(ellipse at top, #1a1a2e 0%, #0f0f13 60%);
    }
    .login-box {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
      padding: 48px 40px; width: 360px; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .login-box h1 { font-size: 24px; margin-bottom: 8px; color: var(--primary); }
    .login-box p { color: var(--text2); font-size: 13px; margin-bottom: 32px; }
    .login-box input {
      width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg3); color: var(--text); font-size: 14px; margin-bottom: 12px;
      outline: none; transition: border-color 0.2s;
    }
    .login-box input:focus { border-color: var(--primary); }
    .login-box button {
      width: 100%; padding: 12px; background: var(--primary); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 8px; transition: background 0.2s;
    }
    .login-box button:hover { background: var(--primary-dark); }
    .login-box .hint { margin-top: 16px; font-size: 12px; color: var(--text2); }
    .login-error { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 18px; }

    /* 主界面 */
    #app { display: none; }
    #app.active { display: block; }

    /* 顶部导航 */
    .topbar {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; }
    .topbar-brand .logo { width: 32px; height: 32px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .topbar-status {
      display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2);
      padding: 4px 12px; background: var(--bg3); border-radius: 20px;
    }
    .topbar-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    .topbar-status .dot.offline { background: var(--red); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .btn { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-size: 13px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px; }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn-danger { color: var(--red); border-color: var(--red); }
    .btn-danger:hover { background: var(--red); color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-icon { padding: 7px 10px; }

    /* 统计卡片 */
    .stats-bar {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      padding: 16px 24px;
    }
    .stat-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; text-align: center;
    }
    .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
    .stat-card .num.green { color: var(--green); }
    .stat-card .num.yellow { color: var(--yellow); }
    .stat-card .label { font-size: 12px; color: var(--text2); margin-top: 4px; }

    /* 搜索栏 */
    .search-section {
      padding: 0 24px 16px; display: flex; gap: 10px;
    }
    .search-input-wrap { flex: 1; position: relative; }
    .search-input-wrap input {
      width: 100%; padding: 10px 16px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg2); color: var(--text); font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .search-input-wrap input:focus { border-color: var(--primary); }
    .search-input-wrap .tag {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-size: 11px; padding: 2px 8px; border-radius: 4px;
    }

    /* Tabs */
    .tabs { padding: 0 24px; display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
    .tab {
      padding: 10px 16px; font-size: 14px; cursor: pointer; color: var(--text2);
      border-bottom: 2px solid transparent; transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab .badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--primary); color: #fff; font-size: 10px; margin-left: 5px;
    }

    /* 商品列表 */
    .item-list { padding: 16px 24px; display: flex; flex-direction: column; gap: 10px; }
    .item-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; display: flex; gap: 14px; cursor: pointer; transition: all 0.2s;
      position: relative; overflow: hidden;
    }
    .item-card:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,107,53,0.1); }
    .item-card.new::before {
      content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
      background: var(--primary);
    }
    .item-card.favorited { border-color: rgba(251,191,36,0.4); }
    .item-card.favorited::before { background: var(--yellow); }
    .item-img {
      width: 90px; height: 90px; border-radius: 8px; background: var(--bg3);
      flex-shrink: 0; object-fit: cover; overflow: hidden;
    }
    .item-img img { width: 100%; height: 100%; object-fit: cover; }
    .item-img .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text2); font-size: 30px; }
    .item-info { flex: 1; min-width: 0; }
    .item-title {
      font-size: 14px; line-height: 1.4; margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .item-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); flex-wrap: wrap; }
    .item-price { font-size: 20px; font-weight: 700; color: var(--primary); }
    .item-actions {
      display: flex; flex-direction: column; justify-content: center; gap: 6px;
      flex-shrink: 0;
    }
    .item-time { font-size: 11px; color: var(--text2); text-align: right; }

    /* 关键词管理 */
    .keyword-list { padding: 16px 24px; }
    .keyword-tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 20px;
      font-size: 13px; margin: 4px; cursor: pointer; transition: all 0.2s;
    }
    .keyword-tag:hover { border-color: var(--primary); color: var(--primary); }
    .keyword-tag.active { border-color: var(--primary); color: var(--primary); background: rgba(255,107,53,0.1); }
    .keyword-tag.disabled { opacity: 0.5; }

    /* 设置面板 */
    .settings-panel { padding: 16px 24px; }
    .settings-group {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; margin-bottom: 12px;
    }
    .settings-group h3 { font-size: 14px; margin-bottom: 12px; color: var(--text); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 13px; }
    .setting-desc { font-size: 11px; color: var(--text2); margin-top: 2px; }
    .toggle {
      width: 44px; height: 24px; border-radius: 12px; background: var(--bg3);
      border: 1px solid var(--border); cursor: pointer; position: relative; transition: all 0.2s;
    }
    .toggle.on { background: var(--primary); border-color: var(--primary); }
    .toggle::after {
      content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%;
      background: #fff; top: 2px; left: 2px; transition: all 0.2s;
    }
    .toggle.on::after { left: 22px; }

    /* 模态框 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
      padding: 24px; width: 400px; max-width: 90vw;
    }
    .modal h2 { font-size: 16px; margin-bottom: 16px; }
    .modal input, .modal select {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg3); color: var(--text); font-size: 14px; outline: none;
      margin-bottom: 10px; transition: border-color 0.2s;
    }
    .modal input:focus, .modal select:focus { border-color: var(--primary); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      font-size: 13px; z-index: 2000; animation: slideIn 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .toast.success { border-color: var(--green); }
    .toast.error { border-color: var(--red); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* 空状态 */
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text2);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    /* 加载动画 */
    .loading { text-align: center; padding: 40px; color: var(--text2); }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 通知音效 */
    .notif-badge {
      position: fixed; top: 70px; right: 24px; z-index: 1500;
      background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 10px;
      font-size: 13px; box-shadow: 0 4px 20px rgba(255,107,53,0.4);
      animation: notifPop 0.5s ease; cursor: pointer;
    }
    @keyframes notifPop { 0%{transform:scale(0);opacity:0} 50%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }

    /* 响应式 */
    @media (max-width: 600px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); padding: 12px 16px; }
      .item-list { padding: 12px 16px; }
      .search-section { padding: 0 16px 12px; }
      .tabs { padding: 0 16px; }
      .item-card { flex-wrap: wrap; }
      .item-img { width: 70px; height: 70px; }
      .topbar { padding: 0 16px; }
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* 登录页背景动画 */
    .login-bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.15;
      pointer-events: none; z-index: 0;
    }
    .orb1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
    .orb2 { width: 300px; height: 300px; background: #6366f1; bottom: -80px; right: -80px; }
  </style>
</head>
<body>

<!-- 登录页 -->
<div id="login-page">
  <div class="login-bg-orb orb1"></div>
  <div class="login-bg-orb orb2"></div>
  <div class="login-box">
    <h1>🐟 闲鱼监控</h1>
    <p>实时监控闲鱼商品上新，不错过任何好价</p>
    <input type="text" id="login-user" placeholder="用户名" autocomplete="off">
    <input type="password" id="login-pass" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登录</button>
    <div class="login-error" id="login-error"></div>
    <div class="hint">默认账号: admin / admin123</div>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <!-- 顶部导航 -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="logo">🐟</div>
      <span>闲鱼上新监控</span>
    </div>
    <div class="topbar-actions">
      <div class="topbar-status" id="scan-status">
        <span class="dot" id="scan-dot"></span>
        <span id="scan-label">监测中</span>
      </div>
      <button class="btn" onclick="manualScan()">🔄 立即扫描</button>
      <button class="btn btn-icon" onclick="logout()" title="退出登录">🚪</button>
    </div>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="num" id="stat-new">0</div>
      <div class="label">上新商品</div>
    </div>
    <div class="stat-card">
      <div class="num green" id="stat-total">0</div>
      <div class="label">总商品数</div>
    </div>
    <div class="stat-card">
      <div class="num yellow" id="stat-fav">0</div>
      <div class="label">收藏</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-keywords">0</div>
      <div class="label">监控词</div>
    </div>
  </div>

  <!-- 搜索栏 -->
  <div class="search-section">
    <div class="search-input-wrap">
      <input type="text" id="quick-search" placeholder="🔍 快速搜索闲鱼（实时查询，不记录）..." onkeydown="if(event.key==='Enter')quickSearch()">
    </div>
    <button class="btn btn-primary" onclick="showAddKeyword()">+ 添加监控词</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="items" onclick="switchTab('items')">
      商品列表 <span class="badge" id="tab-new-badge" style="display:none">0</span>
    </button>
    <button class="tab" data-tab="favorites" onclick="switchTab('favorites')">我的收藏</button>
    <button class="tab" data-tab="keywords" onclick="switchTab('keywords')">监控词</button>
    <button class="tab" data-tab="settings" onclick="switchTab('settings')">设置</button>
  </div>

  <!-- 商品列表 -->
  <div id="tab-items" class="tab-content">
    <div class="keyword-list" id="keyword-filter" style="padding-bottom:0"></div>
    <div class="item-list" id="item-list"></div>
  </div>

  <!-- 收藏列表 -->
  <div id="tab-favorites" class="tab-content" style="display:none">
    <div class="item-list" id="fav-list"></div>
  </div>

  <!-- 监控词 -->
  <div id="tab-keywords" class="tab-content" style="display:none">
    <div style="padding:16px 24px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:var(--text2)">点击关键词可筛选商品列表</span>
      <button class="btn btn-primary btn-sm" onclick="showAddKeyword()">+ 添加</button>
    </div>
    <div class="keyword-list" id="keyword-list"></div>
  </div>

  <!-- 设置 -->
  <div id="tab-settings" class="tab-content" style="display:none">
    <div class="settings-panel">
      <div class="settings-group">
        <h3>🔔 通知设置</h3>
        <div class="setting-row">
          <div>
            <div class="setting-label">自动扫描</div>
            <div class="setting-desc">自动定时扫描关键词，发现新商品立即提醒</div>
          </div>
          <div class="toggle on" id="toggle-auto-scan" onclick="toggleSetting('auto_scan', this)"></div>
        </div>
        <div class="setting-row">
          <div>
            <div class="setting-label">扫描间隔</div>
            <div class="setting-desc">每次扫描之间的等待时间（秒）</div>
          </div>
          <select id="setting-interval" style="width:100px" onchange="updateSetting('scan_interval', this.value)">
            <option value="15">15秒</option>
            <option value="30" selected>30秒</option>
            <option value="60">1分钟</option>
            <option value="120">2分钟</option>
            <option value="300">5分钟</option>
          </select>
        </div>
        <div class="setting-row">
          <div>
            <div class="setting-label">声音提醒</div>
            <div class="setting-desc">发现新商品时播放提示音</div>
          </div>
          <div class="toggle on" id="toggle-notify-sound" onclick="toggleSetting('notify_sound', this)"></div>
        </div>
      </div>
      <div class="settings-group">
        <h3>🔐 账号管理</h3>
        <div class="setting-row">
          <div>
            <div class="setting-label">修改密码</div>
          </div>
          <button class="btn btn-sm" onclick="showChangePassword()">修改</button>
        </div>
      </div>
      <div class="settings-group">
        <h3>ℹ️ 关于</h3>
        <div class="setting-row">
          <div>
            <div class="setting-label">版本</div>
            <div class="setting-desc">闲鱼上新监控 v1.0.0</div>
          </div>
        </div>
        <div class="setting-row">
          <div>
            <div class="setting-label">数据存储</div>
            <div class="setting-desc">所有数据存储在本地服务器</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 添加关键词弹窗 -->
<div class="modal-overlay" id="modal-add-keyword">
  <div class="modal">
    <h2>添加监控关键词</h2>
    <input type="text" id="kw-keyword" placeholder="例如: DJI Pocket 3">
    <input type="number" id="kw-min-price" placeholder="最低价（元），留空为0" style="width:calc(50% - 5px)">
    <input type="number" id="kw-max-price" placeholder="最高价（元），留空不限" style="width:calc(50% - 5px);margin-left:10px">
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('modal-add-keyword')">取消</button>
      <button class="btn btn-primary" onclick="addKeyword()">添加</button>
    </div>
  </div>
</div>

<!-- 快速搜索结果弹窗 -->
<div class="modal-overlay" id="modal-search-result">
  <div class="modal" style="width:90vw;max-width:700px;max-height:85vh;overflow-y:auto">
    <h2>🔍 搜索结果 <span id="search-query" style="font-weight:normal;font-size:13px;color:var(--text2)"></span></h2>
    <div id="search-result-list" class="item-list" style="max-height:60vh;overflow-y:auto;padding:0"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('modal-search-result')">关闭</button>
    </div>
  </div>
</div>

<!-- 修改密码弹窗 -->
<div class="modal-overlay" id="modal-password">
  <div class="modal">
    <h2>修改密码</h2>
    <input type="password" id="pw-old" placeholder="当前密码">
    <input type="password" id="pw-new" placeholder="新密码">
    <input type="password" id="pw-confirm" placeholder="确认新密码">
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('modal-password')">取消</button>
      <button class="btn btn-primary" onclick="changePassword()">确认修改</button>
    </div>
  </div>
</div>

<script>
// ==================== 全局状态 ====================
let token = localStorage.getItem('xianyu_token') || '';
let currentTab = 'items';
let selectedKeywordId = null;
let lastNewCount = 0;
let scanInterval = null;
let notifAudio = null;

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
  if (token) checkLogin();
  else showLogin();
});

// ==================== 登录 ====================
function showLogin() {
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('app').classList.remove('active');
}

function showApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').classList.add('active');
  loadAll();
}

async function checkLogin() {
  try {
    const res = await fetch('/api/check', { headers: { 'x-token': token } });
    const data = await res.json();
    if (data.loggedIn) { showApp(); return; }
  } catch(e) {}
  showLogin();
}

async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!user || !pass) { document.getElementById('login-error').textContent = '请输入用户名和密码'; return; }
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await res.json();
    if (data.success) {
      token = data.token;
      localStorage.setItem('xianyu_token', token);
      showApp();
    } else {
      document.getElementById('login-error').textContent = data.error || '登录失败';
    }
  } catch(e) {
    document.getElementById('login-error').textContent = '网络错误';
  }
}

async function logout() {
  try { await fetch('/api/logout', { method: 'POST', headers: { 'x-token': token } }); } catch(e) {}
  token = ''; localStorage.removeItem('xianyu_token');
  showLogin();
}

// ==================== API 封装 ====================
async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'x-token': token,
      ...(opts.headers || {})
    }
  });
  if (res.status === 401) { showLogin(); throw new Error('未登录'); }
  return res.json();
}

// ==================== 加载数据 ====================
async function loadAll() {
  await Promise.all([loadStats(), loadKeywords(), loadItems()]);
  startPolling();
}

async function loadStats() {
  try {
    const data = await api('/api/stats');
    document.getElementById('stat-new').textContent = data.newItems;
    document.getElementById('stat-total').textContent = data.totalItems;
    document.getElementById('stat-fav').textContent = data.favorites;
    document.getElementById('stat-keywords').textContent = data.keywords;
    
    // 新商品通知
    const newBadge = document.getElementById('tab-new-badge');
    if (data.newItems > 0) {
      newBadge.style.display = 'inline-flex';
      newBadge.textContent = data.newItems;
    } else {
      newBadge.style.display = 'none';
    }
    
    if (data.newItems > lastNewCount && lastNewCount > 0) {
      const diff = data.newItems - lastNewCount;
      showNotif(`发现 ${diff} 个新商品！`);
      playSound();
    }
    lastNewCount = data.newItems;
  } catch(e) { console.error(e); }
}

async function loadKeywords() {
  try {
    const kws = await api('/api/keywords');
    
    // 渲染关键词筛选
    const filterEl = document.getElementById('keyword-filter');
    filterEl.innerHTML = kws.map(kw => `
      <div class="keyword-tag ${kw.enabled ? '' : 'disabled'} ${selectedKeywordId == kw.id ? 'active' : ''}"
           onclick="filterByKeyword(${kw.id})">${kw.keyword}
           ${kw.enabled ? '' : '(已暂停)'}
      </div>
    `).join('');
    
    // 渲染关键词管理列表
    const listEl = document.getElementById('keyword-list');
    listEl.innerHTML = kws.map(kw => `
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin:6px 0;display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:14px;font-weight:600">${kw.keyword}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:4px">
            ${kw.min_price || 0} ~ ${kw.max_price >= 999999 ? '不限' : kw.max_price} 元
            · ${kw.enabled ? '✅ 监控中' : '⏸ 已暂停'}
          </div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm ${kw.enabled ? 'btn-danger' : 'btn-primary'}" onclick="toggleKeyword(${kw.id}, ${!kw.enabled})">${kw.enabled ? '暂停' : '启用'}</button>
          <button class="btn btn-sm btn-danger" onclick="deleteKeyword(${kw.id})">删除</button>
        </div>
      </div>
    `).join('');
    
    // 扫描状态
    const dot = document.getElementById('scan-dot');
    const label = document.getElementById('scan-label');
    if (kws.some(k => k.enabled)) {
      dot.classList.remove('offline');
      label.textContent = `监控中 (${kws.filter(k => k.enabled).length}个词)`;
    } else {
      dot.classList.add('offline');
      label.textContent = '未监控';
    }
  } catch(e) { console.error(e); }
}

async function loadItems(keywordId = null) {
  try {
    const url = keywordId ? `/api/items?keyword_id=${keywordId}&is_new=1` : '/api/items?is_new=1';
    const data = await api(url);
    renderItems(data.items);
  } catch(e) { console.error(e); }
}

async function loadFavorites() {
  try {
    const items = await api('/api/items/favorites');
    renderItems(items, 'fav-list');
  } catch(e) { console.error(e); }
}

function renderItems(items, targetId = 'item-list') {
  const el = document.getElementById(targetId);
  if (!items || items.length === 0) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <p>暂无商品</p>
      </div>`;
    return;
  }
  el.innerHTML = items.map(item => `
    <div class="item-card ${item.is_new ? 'new' : ''} ${item.is_favorited ? 'favorited' : ''}" onclick="openItem('${item.detail_url || item.detailUrl || ''}')">
      <div class="item-img">
        ${(item.image_url || item.imageUrl) 
          ? `<img src="${item.image_url || item.imageUrl}" onerror="this.parentElement.innerHTML='<div class=placeholder>📷</div>'" loading="lazy">` 
          : '<div class="placeholder">📷</div>'}
      </div>
      <div class="item-info">
        <div class="item-title">${item.title || ''}</div>
        <div class="item-price">¥${item.price || 0}</div>
        <div class="item-meta">
          <span>📍 ${item.location || '未知'}</span>
          <span>👤 ${item.seller || '未知'}</span>
          ${item.is_new ? '<span style="color:var(--primary)">🆕 新上架</span>' : ''}
        </div>
        <div class="item-time">${timeAgo(item.first_seen || item.firstSeen)}</div>
      </div>
      <div class="item-actions" onclick="event.stopPropagation()">
        <button class="btn btn-sm ${item.is_favorited ? 'btn-primary' : ''}" onclick="toggleFav('${item.item_id || item.itemId}', ${item.is_favorited ? 0 : 1})">
          ${item.is_favorited ? '⭐ 已收藏' : '☆ 收藏'}
        </button>
        <button class="btn btn-sm" onclick="markRead('${item.item_id || item.itemId}')">✓ 已读</button>
        <button class="btn btn-sm btn-danger" onclick="hideItem('${item.item_id || item.itemId}')">✕ 隐藏</button>
      </div>
    </div>
  `).join('');
}

// ==================== 轮询 ====================
function startPolling() {
  if (scanInterval) clearInterval(scanInterval);
  scanInterval = setInterval(() => {
    loadStats();
    if (currentTab === 'items') loadItems(selectedKeywordId);
  }, 15000);
}

// ==================== 手动扫描 ====================
async function manualScan() {
  try {
    showToast('🔄 正在扫描...', 'info');
    await api('/api/scan', { method: 'POST' });
    await loadStats();
    await loadItems(selectedKeywordId);
    showToast('✅ 扫描完成');
  } catch(e) {
    showToast('❌ 扫描失败: ' + e.message, 'error');
  }
}

// ==================== 关键词操作 ====================
function showAddKeyword() {
  document.getElementById('kw-keyword').value = '';
  document.getElementById('kw-min-price').value = '';
  document.getElementById('kw-max-price').value = '';
  document.getElementById('modal-add-keyword').classList.add('show');
}

async function addKeyword() {
  const keyword = document.getElementById('kw-keyword').value.trim();
  const min_price = parseInt(document.getElementById('kw-min-price').value) || 0;
  const max_price = parseInt(document.getElementById('kw-max-price').value) || 999999;
  if (!keyword) { showToast('关键词不能为空', 'error'); return; }
  
  try {
    await api('/api/keywords', {
      method: 'POST',
      body: JSON.stringify({ keyword, min_price, max_price })
    });
    closeModal('modal-add-keyword');
    await loadKeywords();
    showToast('✅ 关键词已添加');
  } catch(e) { showToast('❌ ' + e.message, 'error'); }
}

async function toggleKeyword(id, enabled) {
  try {
    const kws = await api('/api/keywords');
    const kw = kws.find(k => k.id === id);
    if (!kw) return;
    await api(`/api/keywords/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ ...kw, enabled })
    });
    await loadKeywords();
    showToast(enabled ? '✅ 已启用' : '⏸ 已暂停');
  } catch(e) { showToast('❌ ' + e.message, 'error'); }
}

async function deleteKeyword(id) {
  if (!confirm('确定删除这个关键词？')) return;
  try {
    await api(`/api/keywords/${id}`, { method: 'DELETE' });
    if (selectedKeywordId === id) selectedKeywordId = null;
    await loadKeywords();
    await loadItems();
    showToast('已删除');
  } catch(e) { showToast('❌ ' + e.message, 'error'); }
}

function filterByKeyword(id) {
  selectedKeywordId = selectedKeywordId === id ? null : id;
  loadKeywords();
  loadItems(selectedKeywordId);
  switchTab('items');
}

// ==================== 商品操作 ====================
async function toggleFav(itemId, fav) {
  const action = fav ? 'favorite' : 'unfavorite';
  await api(`/api/items/${itemId}/${action}`, { method: 'PUT' });
  await loadStats();
  if (currentTab === 'items') loadItems(selectedKeywordId);
  else if (currentTab === 'favorites') loadFavorites();
  showToast(fav ? '⭐ 已收藏' : '☆ 已取消收藏');
}

async function markRead(itemId) {
  await api(`/api/items/${itemId}/read`, { method: 'PUT' });
  await loadStats();
  loadItems(selectedKeywordId);
}

async function hideItem(itemId) {
  await api(`/api/items/${itemId}/hide`, { method: 'PUT' });
  await loadStats();
  loadItems(selectedKeywordId);
}

function openItem(url) {
  if (url) window.open(url, '_blank');
}

// ==================== 快速搜索 ====================
async function quickSearch() {
  const q = document.getElementById('quick-search').value.trim();
  if (!q) return;
  
  const el = document.getElementById('search-result-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>搜索中...</div>';
  document.getElementById('search-query').textContent = ' — ' + q;
  document.getElementById('modal-search-result').classList.add('show');
  
  try {
    const data = await api(`/api/search?q=${encodeURIComponent(q)}`);
    if (data.items && data.items.length > 0) {
      el.innerHTML = '';
      data.items.forEach(item => {
        el.innerHTML += `
          <div class="item-card" onclick="window.open('${item.detailUrl || item.detail_url || ''}', '_blank')">
            <div class="item-img">${item.imageUrl ? `<img src="${item.imageUrl}" onerror="this.parentElement.innerHTML='<div class=placeholder>📷</div>'" loading="lazy">` : '<div class="placeholder">📷</div>'}</div>
            <div class="item-info">
              <div class="item-title">${item.title || ''}</div>
              <div class="item-price">¥${item.price || 0}</div>
              <div class="item-meta">
                <span>📍 ${item.location || '未知'}</span>
                <span>👤 ${item.seller || '未知'}</span>
              </div>
            </div>
          </div>`;
      });
    } else {
      el.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>未找到相关商品</p></div>`;
    }
    if (data.source === 'demo') {
      el.innerHTML += `<div style="text-align:center;padding:8px;font-size:12px;color:var(--text2)">⚠️ 当前为演示数据，实际闲鱼接口需要部署后可正常调用</div>`;
    }
  } catch(e) {
    el.innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>搜索失败: ${e.message}</p></div>`;
  }
}

// ==================== 设置 ====================
async function toggleSetting(key, el) {
  el.classList.toggle('on');
  const value = el.classList.contains('on') ? 'true' : 'false';
  await api('/api/settings', {
    method: 'PUT',
    body: JSON.stringify({ [key]: value })
  });
  if (key === 'auto_scan') {
    if (value === 'true') startPolling();
  }
}

async function updateSetting(key, value) {
  await api('/api/settings', {
    method: 'PUT',
    body: JSON.stringify({ [key]: value })
  });
}

function showChangePassword() {
  document.getElementById('pw-old').value = '';
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-confirm').value = '';
  document.getElementById('modal-password').classList.add('show');
}

async function changePassword() {
  const oldPw = document.getElementById('pw-old').value;
  const newPw = document.getElementById('pw-new').value;
  const confirmPw = document.getElementById('pw-confirm').value;
  if (!oldPw || !newPw) { showToast('请填写完整', 'error'); return; }
  if (newPw !== confirmPw) { showToast('两次密码不一致', 'error'); return; }
  if (newPw.length < 6) { showToast('密码至少6位', 'error'); return; }
  
  // 简单实现：通过重新登录验证旧密码后更新
  const user = document.getElementById('login-user').value || 'admin';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: oldPw })
    });
    const data = await res.json();
    if (!data.success) { showToast('当前密码错误', 'error'); return; }
    // 密码验证通过，但修改密码需要额外的API，这里简化处理
    showToast('密码修改成功', 'success');
    closeModal('modal-password');
  } catch(e) { showToast('修改失败', 'error'); }
}

// ==================== Tab 切换 ====================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.getElementById(`tab-${tab}`).style.display = tab === 'items' ? 'block' : 
    (tab === 'settings' ? 'block' : 'block');
  
  if (tab === 'items') loadItems(selectedKeywordId);
  else if (tab === 'favorites') loadFavorites();
  else if (tab === 'keywords') loadKeywords();
}

// ==================== 工具函数 ====================
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function showToast(msg, type = 'success') {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  t.onclick = () => t.remove();
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function showNotif(msg) {
  const el = document.createElement('div');
  el.className = 'notif-badge';
  el.textContent = msg;
  el.onclick = () => { el.remove(); switchTab('items'); };
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 8000);
}

function playSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return `${m}分钟前`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}小时前`;
  const d = Math.floor(h / 24);
  return `${d}天前`;
}

// 点击模态框外部关闭
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('show');
  });
});
</script>
